[project]
name = "fall-impact-monitor"
version = "0.1.0"
description = "Local, privacy-first detection of possible falls and possible head impacts from RTSP cameras."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.20",
    "aiohttp>=3.10",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "av>=19",
    "numpy>=2",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "trackers>=2.7",
    "tzdata>=2024.1",
]

[project.scripts]
fim = "fall_impact_monitor.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fall_impact_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Vendored upstream code keeps its original structure.
"src/fall_impact_monitor/_vendor/**" = ["SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.uv]
# trackers/supervision depend on opencv-python; the headless build provides the same cv2 module
# without GUI libraries, so the GUI package is never installed.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
