<rect x="1076" y="320" width="122" height="30" rx="6" fill="none" stroke="#DCE5E0" stroke-width="2"/>
<text x="1137" y="340" font-size="15" font-weight="700" fill="#DCE5E0" text-anchor="middle">Watch video</text>
<rect x="1064" y="376" width="146" height="76" rx="10" fill="#26302C"/>
<text x="1076" y="402" font-size="16" font-weight="700" fill="#DCE5E0" text-anchor="start">Monitoring</text>
<text x="1076" y="422" font-size="16" font-weight="700" fill="#DCE5E0" text-anchor="start">degraded</text>
<text x="1076" y="442" font-size="15" font-weight="400" fill="#97A79F" text-anchor="start">camera lost</text>
<path d="M 230 312 V 560 H 900 V 335 H 1062" fill="none" stroke="#97A79F" stroke-width="2.5" stroke-dasharray="9 7"/>
<path d="M 1074 335 L 1060 327 L 1060 343 Z" fill="#97A79F"/>
<text x="260" y="592" font-size="19" font-weight="400" fill="#97A79F" text-anchor="start">A clip leaves the home only when someone presses Watch video.</text>
</svg>
