            - generic [ref=f4e177]:
              - paragraph [ref=f4e178]: This dataset is publicly available, and it comprises 11 activities performed by 17 subjects during 3 attempts each.
              - paragraph [ref=f4e179]
              - paragraph [ref=f4e180]: "The organization of the dataset is as follows:"
              - list [ref=f4e181]:
                - listitem [ref=f4e182]:
                  - text: "17-folders, one per subject:"
                  - list [ref=f4e183]:
                    - listitem [ref=f4e184]:
                      - text: "11-subfolders, one per activity:"
                      - list [ref=f4e185]:
                        - listitem [ref=f4e186]:
                          - text: "3 - subfoldes, one per trial:"
                          - list [ref=f4e187]:
                            - listitem [ref=f4e188]: 1-CSV file containing the sensor signals of the attempt.
              - paragraph [ref=f4e189]
            - generic [ref=f4e193]:
              - paragraph [ref=f4e194]: "Each CSV file contains the following information:"
              - paragraph [ref=f4e195]
              - list [ref=f4e196]:
                - listitem [ref=f4e197]: "[Column 1] Timestamp"
                - listitem [ref=f4e198]: "[Columns 2 - 4] IMU (ankle): accelerometer X, Y & Z"
                - listitem [ref=f4e199]: "[Columns 5 - 7] IMU (ankle): angular velocity X, Y & Z"
                - listitem [ref=f4e200]: "[Column 8] IMU (ankle): luminosity"
                - listitem [ref=f4e201]: "[Columns 9 - 11] IMU (Right pocket): accelerometer X, Y & Z"
                - listitem [ref=f4e202]: "[Columns 12 - 14] IMU (Right pocket): angular velocity X, Y & Z"
                - listitem [ref=f4e203]: "[Column 15] IMU (Right pocket): luminosity"
                - listitem [ref=f4e204]: "[Columns 16 - 18] IMU (belt): accelerometer X, Y & Z"
                - listitem [ref=f4e205]: "[Columns 19 - 21] IMU (belt): angular velocity X, Y & Z"
                - listitem [ref=f4e206]: "[Column 22] IMU (belt): luminosity"
                - listitem [ref=f4e207]: "[Columns 23 - 25] IMU (neck): accelerometer X, Y & Z"
                - listitem [ref=f4e208]: "[Columns 26 - 28] IMU (neck): angular velocity X, Y & Z"
                - listitem [ref=f4e209]: "[Column 29] IMU (neck): luminosity"
                - listitem [ref=f4e210]: "[Columns 30 - 32] IMU (wrist): accelerometer X, Y & Z"
                - listitem [ref=f4e211]: "[Columns 33 - 35] IMU (wrist): angular velocity X, Y & Z"
                - listitem [ref=f4e212]: "[Column 36] IMU (wrist): luminosity"
                - listitem [ref=f4e213]: "[Column 37] Raw value from EEG NeuroSky helmet"
                - listitem [ref=f4e214]: "[Column 38] Infrared Sensor 1"
                - listitem [ref=f4e215]: "[Column 39] Infrared Sensor 2"
                - listitem [ref=f4e216]: "[Column 40] Infrared Sensor 3"
                - listitem [ref=f4e217]: "[Column 41] Infrared Sensor 4"
                - listitem [ref=f4e218]: "[Column 42] Infrared Sensor 5"
                - listitem [ref=f4e219]: "[Column 43] Infrared Sensor 6"
            - generic [ref=f4e223]:
              - paragraph [ref=f4e224]
              - paragraph [ref=f4e225]:
                - strong [ref=f4e226]: "If you use this data set, please cite as follows:"
              - list [ref=f4e227]:
                - listitem [ref=f4e228]: "Lourdes Martínez-Villaseñor, Hiram Ponce, Jorge Brieva, Ernesto Moya-Albor, José Núñez-Martínez, Carlos Peñafort-Asturiano, “UP-Fall Detection Dataset: A Multimodal Approach”, Sensors 19(9), 1988: 2019, doi:10.3390/s19091988."
              - paragraph [ref=f4e229]
          - generic [ref=f4e239]:
            - heading "Downloads" [level=2]:
              - generic [ref=f4e240]:
                - generic:
                  - generic [aria-hidden]:
                    - button
                - text: Downloads
            - paragraph [ref=f4e241]: In this section, you can use the following layout to chose the elements you want to download, by selecting a subject, activity and trial. In this layout you can look for specific files, however, if your interest lies in the complete data sets, you can use the links under the "Complete Downloads" heading to get those (unfortunately we don't have a single file for all the images).
            - paragraph [ref=f4e242]: "Each file contains:"
            - list [ref=f4e243]:
              - listitem [ref=f4e244]:
                - strong [ref=f4e245]: Data Set
                - text: ": all acquired data (synchronized, and organized with tags)."
              - listitem [ref=f4e246]:
                - strong [ref=f4e247]: FeaturesX&Y
                - text: ": features obtained from the collected data. The X value refers to the separation (in seconds) in which the features were obtained and the Y value to the window-length (also in seconds) each feature considered."
              - listitem [ref=f4e248]:
                - strong [ref=f4e249]: CameraX
                - text: ": refers to a zip file with the images corresponding to each trial, taken with Camera X."
              - listitem [ref=f4e250]:
                - strong [ref=f4e251]: CameraX_OF
                - text: ": refers to a zip file with Camera X's features (Optical Flow)."
              - listitem [ref=f4e252]:
                - strong [ref=f4e253]: Camera Resized OF
                - text: ": refers to a csv file with both camera's OF, resized to a 20x20 matrix."
              - listitem [ref=f4e254]:
                - strong [ref=f4e255]: Camera OF FeaturesX&Y
                - text: ": refers to a csv file with both camera's OF, resized to a 20x20 matrix. From these files the mean was taken as the only feature, where the X value refers to the separation (in seconds) in which the feature was obtained and the Y value to the window-length (also in seconds) the feature considered."
