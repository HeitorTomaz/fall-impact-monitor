name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fim
          POSTGRES_PASSWORD: fim
          POSTGRES_DB: fim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fim -d fim_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      FIM_TEST_DATABASE_URL: postgresql+asyncpg://fim:fim@localhost:5432/fim_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check && uv run --frozen ruff format --check
      - name: Type check
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest -q
