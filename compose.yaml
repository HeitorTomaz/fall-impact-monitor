name: fall-impact-monitor

services:
  # The monitoring service (`fim run`). Tools run in the same image:
  # `docker compose run --rm app fim …`.
  app:
    build:
      context: .
      target: runtime
    image: fall-impact-monitor-app:local
    command: ["fim", "run"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # The service rewrites /tmp/fim-alive every 10 s; a stale file marks it unhealthy.
    # Compose does not restart an unhealthy container by itself: the service's own
    # watchdog exits when a camera worker is stuck, and restart: unless-stopped restarts it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/fim-alive') > 60)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      # Read-write: retention deletes old segments (same uid as MediaMTX).
      - recordings:/recordings
      - events:/events
      - artifacts:/app/artifacts
      # Zone files: written by `fim zones`, read by the service (FIM_CAMERA_<ID>_ZONES_FILE).
      - ./local/zones:/app/local/zones
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      mediamtx:
        condition: service_started
      # Started, not "healthy": tools and alerts must not wait for the database.
      postgres:
        condition: service_started

  # One-shot: gives the non-root users (uid 10001) ownership of the shared volumes.
  init-volumes:
    image: busybox:1.37
    command: ["chown", "-R", "10001:10001", "/recordings", "/events", "/mediamtx-config"]
    volumes:
      - recordings:/recordings
      - events:/events
      - mediamtx-config:/mediamtx-config
    restart: "no"

  # One-shot: writes the MediaMTX configuration from the FIM_* camera variables on every
  # start (single source of truth). The file holds camera URLs and is owner-readable only.
  mediamtx-config:
    build:
      context: .
      target: runtime
    image: fall-impact-monitor-app:local
    user: "10001:10001"
    env_file:
      - path: .env
        required: false
    command: ["fim", "mediamtx-config", "--out", "/mediamtx-config/mediamtx.json"]
    volumes:
      - mediamtx-config:/mediamtx-config
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    restart: "no"

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    user: "10001:10001"
    command: ["/mediamtx-config/mediamtx.json"]
    volumes:
      - mediamtx-config:/mediamtx-config:ro
      - recordings:/recordings
    depends_on:
      mediamtx-config:
        condition: service_completed_successfully
    restart: unless-stopped

  # Events, notification states, the recorded-span index and health history. Never video.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fim
      POSTGRES_DB: fim
      POSTGRES_PASSWORD: ${FIM_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fim -d fim"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Development only: runs tests and tools against the bind-mounted source tree.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: fall-impact-monitor-dev:local
    env_file:
      - path: .env
        required: false
    environment:
      # Throwaway test database (postgres-test); never the real one.
      FIM_TEST_DATABASE_URL: postgresql+asyncpg://fim:fim@postgres-test:5432/fim_test
    volumes:
      - .:/app
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["uv", "run", "--frozen", "pytest", "-q"]

  # Development only: empty database in memory for the storage tests.
  postgres-test:
    profiles: ["dev"]
    image: postgres:17
    environment:
      POSTGRES_USER: fim
      POSTGRES_PASSWORD: fim
      POSTGRES_DB: fim_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fim -d fim_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Development only: MediaMTX for the integration tests (tests/integration), with the
  # generated configuration of one `publisher` path and recordings in memory.
  mediamtx-test:
    profiles: ["itest"]
    image: bluenviron/mediamtx:1.21.3
    command: ["/cfg/mediamtx.json"]
    volumes:
      - ./tests/integration/mediamtx.json:/cfg/mediamtx.json:ro
    tmpfs:
      - /recordings

  # Development only: publishes a looped local video into MediaMTX as a simulated camera.
  camera-sim:
    profiles: ["sim"]
    build:
      context: deploy/camera-sim
    image: fall-impact-monitor-camera-sim:local
    environment:
      FIM_SIM_FILE: ${FIM_SIM_FILE:-sample.mp4}
      FIM_SIM_TARGET: ${FIM_SIM_TARGET:-rtsp://mediamtx:8554/cam1}
    volumes:
      - ${FIM_SIM_MEDIA_DIR:-./test_videos}:/media:ro
    depends_on:
      - mediamtx

volumes:
  pgdata:
  recordings:
  events:
  artifacts:
  mediamtx-config:
